name: Build TLS Test Images

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "13 5 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build_tls_test_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        images: [nginx-1.30.0_openssl-3.5.7, nginx-1.2.9_openssl-1.0.1f, postfix-2.11.0_openssl-1.0.1f, mariadb-12.3, debian-weakkeys]

    name: Build TLS Test Images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build TLS test image ${{ matrix.images }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.images }}
          push: true
          tags: ghcr.io/jsandas/${{ matrix.images }}
