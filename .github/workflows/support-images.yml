name: Build TLS Test Images

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "13 5 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build_tls_test_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        images: [nginx_good, nginx_bad, postfix_bad, mariadb_good, debian-weakkeys]

    name: Build TLS Test Images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build TLS test image ${{ matrix.images }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.images }}
          push: true
          tags: ghcr.io/jsandas/${{ matrix.images }}
