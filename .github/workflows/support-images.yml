name: Build TLS Test Images

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "13 5 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build_tls_test_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        images: [nginx-1.30.0_openssl-3.5.7, nginx-1.2.9_openssl-1.0.1f, postfix-2.11.0_openssl-1.0.1f, mariadb-12.3, debian-weakkeys]

    name: Build TLS Test Images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build TLS test image ${{ matrix.images }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.images }}
          push: true
          tags: ghcr.io/jsandas/${{ matrix.images }}
